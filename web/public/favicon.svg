<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Mars Route Planner (MRP)</title>
  <defs>
    <linearGradient id="mrp-planet" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb13b"/>
      <stop offset=".55" stop-color="#ff641d"/>
      <stop offset="1" stop-color="#b8261f"/>
    </linearGradient>
  </defs>
  <!-- Mars -->
  <circle cx="32" cy="32" r="29" fill="url(#mrp-planet)"/>
  <circle cx="21" cy="20" r="4" fill="#d8481f" opacity=".7"/>
  <circle cx="44" cy="44" r="5" fill="#d8481f" opacity=".6"/>
  <!-- Route: habitat (A) to a target, through one waypoint -->
  <path d="M17 45 C24 44 26 33 32 32 S40 22 47 19" fill="none" stroke="#0b0d12" stroke-width="7" stroke-linecap="round"/>
  <path d="M17 45 C24 44 26 33 32 32 S40 22 47 19" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="17" cy="45" r="6" fill="#2e7d32" stroke="#fff" stroke-width="2.5"/>
  <circle cx="47" cy="19" r="6" fill="#fff" stroke="#0b0d12" stroke-width="2.5"/>
</svg>
