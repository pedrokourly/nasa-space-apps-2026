<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spike #2 - Tiles do Mars Trek no Leaflet (EPSG:4326)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; background: #222; }
  .info { background: rgba(255,255,255,.92); padding: 6px 10px; border-radius: 4px;
          box-shadow: 0 0 8px rgba(0,0,0,.4); font-size: 12px; line-height: 1.4; max-width: 280px; }
  .info label { display: block; margin-top: 4px; }
  .info input[type=range] { width: 120px; vertical-align: middle; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/*
 * Spike da issue #2. HTML puro, abre direto por file://.
 * CRS: L.CRS.EPSG4326. No Leaflet 1.9 o "mundo" no zoom 0 tem 512 x 256 px
 * (2 tiles de 256 de largura x 1 de altura), o mesmo layout do TileMatrixSet
 * default028mm do Mars Trek (zoom 0 = 2 x 1, origem em lon -180 / lat 90).
 * Por isso NAO precisa de zoomOffset nem de tms:true; {y} = TileRow, contada do norte.
 */
var TREK = 'https://trek.nasa.gov/tiles/Mars/EQ/';
var T = '/1.0.0/default/default028mm/{z}/{y}/{x}.';

// Jezero (marcador): centro da cratera ~ 18.44 N, 77.45 E (lon em -180..180)
var JEZERO = [18.44, 77.45];

var map = L.map('map', {
  crs: L.CRS.EPSG4326,
  center: JEZERO,
  zoom: 5,
  minZoom: 0,
  maxZoom: 18,
  worldCopyJump: false
});

// bounds no formato Leaflet: [[sul, oeste], [norte, leste]] (lat, lon)
var layers = {
  base: {
    'MOLA color hillshade (MGS) - global, z0-7': L.tileLayer(TREK + 'Mars_MGS_MOLA_ClrShade_merge_global_463m' + T + 'jpg', {
      tileSize: 256, maxNativeZoom: 7, maxZoom: 18,
      attribution: 'NASA/JPL/MGS MOLA via Mars Trek'
    }),
    'Viking MDIM 2.1 colorido (fallback) - global, z0-7': L.tileLayer(TREK + 'Mars_Viking_MDIM21_ClrMosaic_global_232m' + T + 'jpg', {
      tileSize: 256, maxNativeZoom: 7, maxZoom: 18,
      attribution: 'NASA/JPL/USGS Viking MDIM 2.1 via Mars Trek'
    })
  },
  overlays: {
    'THEMIS IR dia (Odyssey) - 65S a 65N, z0-9': L.tileLayer(TREK + 'THEMIS_DayIR_ControlledMosaics_100m_v2_oct2018' + T + 'png', {
      tileSize: 256, maxNativeZoom: 9, maxZoom: 18, opacity: 0.7,
      bounds: [[-65.0006576, -179.9999997], [65.0007535, 179.9998849]],
      attribution: 'NASA/JPL/ASU THEMIS via Mars Trek'
    }),
    'CTX global (MRO) via Esri, 512 px, z1-12 (Leaflet)': L.tileLayer('https://astro.arcgis.com/arcgis/rest/services/OnMars/CTX/MapServer/tile/{z}/{y}/{x}', {
      // tiles de 512 px: o mundo no zoom WMTS 0 e 2x1 tiles de 512 px;
      // no Leaflet (tileSize 512) isso equivale ao zoom 1, logo zoomOffset -1
      tileSize: 512, zoomOffset: -1, minZoom: 1, maxNativeZoom: 12, maxZoom: 18, opacity: 0.7,
      attribution: 'NASA/MRO CTX (Caltech, mosaico beta01) via Mars Trek / Esri'
    }),
    'CTX Jezero controlado, 6 m (MRO), z0-13': L.tileLayer(TREK + 'JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0' + T + 'png', {
      tileSize: 256, maxNativeZoom: 13, maxZoom: 18, opacity: 0.85,
      bounds: [[18.2110274, 77.1604655], [18.7211945, 77.6991776]],
      attribution: 'NASA/JPL/MRO CTX Jezero via Mars Trek'
    }),
    'CTX Jezero preliminar (MRO), z0-12': L.tileLayer(TREK + 'Jezero_CTX_BlockAdj_dd' + T + 'png', {
      tileSize: 256, maxNativeZoom: 12, maxZoom: 18, opacity: 0.85,
      bounds: [[15.9058484, 75.1537692], [19.4453003, 78.8717121]],
      attribution: 'NASA/JPL/MRO CTX Jezero (BlockAdj) via Mars Trek'
    }),
    'HiRISE Jezero ortho 25 cm (MRO), z0-17': L.tileLayer(TREK + 'JEZ_hirise_soc_006_orthoMosaic_25cm_Eqc_latTs0_lon0_first_dd' + T + 'png', {
      tileSize: 256, maxNativeZoom: 17, maxZoom: 18, opacity: 1,
      bounds: [[18.3067994, 77.2229331], [18.669315, 77.583964]],
      attribution: 'NASA/JPL/UArizona MRO HiRISE Jezero via Mars Trek'
    })
  }
};

// camada base inicial
layers.base['MOLA color hillshade (MGS) - global, z0-7'].addTo(map);

L.control.layers(layers.base, layers.overlays, { collapsed: false }).addTo(map);
L.control.scale({ metric: true, imperial: false }).addTo(map);
// Atencao: o controle de escala do Leaflet usa o raio da TERRA em CRS geograficos.
// Aqui serve so de referencia visual do spike; o app deve usar o haversine com R = 3389,5 km.

L.marker(JEZERO).addTo(map).bindPopup('Cratera Jezero<br>18.44&deg;N, 77.45&deg;E').openPopup();

// Controle simples de opacidade para os overlays
var OpacityControl = L.Control.extend({
  options: { position: 'bottomleft' },
  onAdd: function () {
    var div = L.DomUtil.create('div', 'info');
    div.innerHTML = '<b>Opacidade dos overlays</b>';
    Object.keys(layers.overlays).forEach(function (name) {
      var lyr = layers.overlays[name];
      var label = L.DomUtil.create('label', '', div);
      var short = name.split(' (')[0].split(',')[0];
      var input = document.createElement('input');
      input.type = 'range'; input.min = 0; input.max = 1; input.step = 0.05;
      input.value = lyr.options.opacity;
      input.addEventListener('input', function () { lyr.setOpacity(parseFloat(input.value)); });
      label.appendChild(document.createTextNode(short + ' '));
      label.appendChild(input);
    });
    L.DomEvent.disableClickPropagation(div);
    return div;
  }
});
new OpacityControl().addTo(map);

// Mostra lat/lon do cursor e zoom para conferir o alinhamento
var Coord = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd: function () { this._d = L.DomUtil.create('div', 'info'); this._d.textContent = 'mova o mouse'; return this._d; }
});
var coord = new Coord().addTo(map);
function upd(e) {
  var ll = e ? e.latlng : map.getCenter();
  coord._d.textContent = 'lat ' + ll.lat.toFixed(4) + '  lon ' + ll.lng.toFixed(4) + '  z ' + map.getZoom();
}
map.on('mousemove', upd);
map.on('zoomend', function () { upd(); });
</script>
</body>
</html>
